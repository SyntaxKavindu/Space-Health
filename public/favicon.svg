<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Space Health Monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- orbit ring and satellite -->
  <ellipse cx="32" cy="32" rx="27" ry="11" transform="rotate(-25 32 32)"
    fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" />
  <circle cx="40.2" cy="17.7" r="3.5" fill="#fff" />

  <!-- heartbeat line -->
  <path d="M9 34 H21 L26 20 L33 46 L38 30 H55"
    fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>